<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#0f1117" />
      <stop offset="100%" stop-color="#090a0f" />
    </linearGradient>

    <!-- Neon Glow Gradient -->
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Accent Node Gradient -->
    <linearGradient id="nodeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e0e7ff" />
    </linearGradient>

    <!-- Subtle Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="#8b5cf6" stroke-width="1.5" stroke-opacity="0.4" />

  <!-- Inner Ambient Glow Ring -->
  <rect x="3.5" y="3.5" width="57" height="57" rx="14.5" fill="none" stroke="url(#neonGrad)" stroke-width="0.8" stroke-opacity="0.25" />

  <!-- Connecting Workflow Lines -->
  <g filter="url(#glow)">
    <!-- Path to Top Right -->
    <path d="M22 32 C22 23, 27 20, 42 20" fill="none" stroke="url(#neonGrad)" stroke-width="3.2" stroke-linecap="round" />
    <!-- Path to Bottom Right -->
    <path d="M22 32 C22 41, 27 44, 42 44" fill="none" stroke="url(#neonGrad)" stroke-width="3.2" stroke-linecap="round" />
  </g>

  <!-- Top Right Node -->
  <circle cx="42" cy="20" r="5.5" fill="url(#nodeGrad)" stroke="#a855f7" stroke-width="2.5" />
  <circle cx="42" cy="20" r="2.2" fill="#7c3aed" />

  <!-- Bottom Right Node -->
  <circle cx="42" cy="44" r="5.5" fill="url(#nodeGrad)" stroke="#38bdf8" stroke-width="2.5" />
  <circle cx="42" cy="44" r="2.2" fill="#0284c7" />

  <!-- Primary Center Node (Larger) -->
  <circle cx="22" cy="32" r="7.5" fill="url(#nodeGrad)" stroke="#c084fc" stroke-width="3" />
  <circle cx="22" cy="32" r="3.2" fill="#8b5cf6" />

  <!-- AI Pulse Star Accent in Upper Right -->
  <path d="M49 10 L50.2 13 L53.2 14.2 L50.2 15.4 L49 18.4 L47.8 15.4 L44.8 14.2 L47.8 13 Z" fill="#facc15" opacity="0.95" />
</svg>
